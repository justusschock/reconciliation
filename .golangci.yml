version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus the linters the project conventions require. bodyclose is not
  # enabled because the module makes no HTTP calls.
  default: standard
  enable:
    - errorlint
    - misspell

formatters:
  enable:
    - gofmt
    - goimports
